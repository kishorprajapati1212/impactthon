# Netlify deploy config for AttendX frontend
[build]
  command = "npm run build"
  publish = "dist"

# Same-origin API (recommended, no CORS): uncomment and put your API host here.
# Must stay ABOVE the SPA rule. Then leave VITE_API_URL unset.
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA redirect (backup to public/_redirects). Real files in public/ - sitemap.xml,
# robots.txt, og-image.png, version.json - are served BEFORE this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Set these in Netlify UI → Site configuration → Environment variables
  # SITE_URL      = https://your-domain.example   (absolute URLs in sitemap/canonical; defaults to the Netlify URL)
  # VITE_API_URL  = https://your-api-host.example.com   (only if you do NOT use the /api/* proxy rule above)

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand icons / manifest - safe to cache for a day (regenerate with scripts/brand-assets.py)
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
