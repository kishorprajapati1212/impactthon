# Netlify deploy config for AttendX frontend
[build]
  command = "npm run build"
  publish = "dist"

# SPA redirect (backup to public/_redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Set this in Netlify UI → Site settings → Environment variables
  # VITE_API_URL = https://your-api-host.example.com

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
