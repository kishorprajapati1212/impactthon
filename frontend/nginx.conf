server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── API, same origin ───────────────────────────────────────────────
    # The app calls /api/* on this host; forward it to the API container.
    # The server serves every route under /api as well, so no rewrite is
    # needed. Resolving through Docker's DNS at request time (not at boot)
    # means nginx still starts even if the API container is still building.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $attendx_api http://server:3000;
        proxy_pass $attendx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;          # Excel/CSV downloads stream straight through
        client_max_body_size 5m;
        add_header Cache-Control "no-store" always;
    }

    # SPA: serve index.html for all non-file routes (fixes refresh 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the SPA shell or the version file (a new build must show up on the next load)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        expires -1;
    }
}
