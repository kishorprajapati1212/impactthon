    <!-- Structured data — SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AttendX",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "QR code based attendance management system with GPS geofence verification, live rotating QR codes, role-based dashboards and Excel export for colleges, universities and schools.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "featureList": [
          "Live rotating QR codes",
          "GPS geofence verification",
          "Faculty live sessions",
          "Student QR scanner",
          "Admin analytics dashboard",
          "Excel attendance export",
          "Late / manual marking",
          "Parent notifications"
        ]
      }
    </script>

    <!-- Structured data — FAQ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does the AttendX QR attendance system work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A faculty member starts a live lecture and a QR code appears on screen, refreshing every 5 seconds so screenshots cannot be reused. Students point their phone camera at the code; AttendX verifies the code signature and the student's GPS location before marking them present."
            }
          },
          {
            "@type": "Question",
            "name": "Does AttendX prevent proxy attendance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The QR code rotates every 5 seconds and is only valid for about 25 seconds, and every scan is cross-checked against the classroom geofence and the student's live GPS coordinates, so a classmate cannot mark attendance on someone else's behalf remotely."
            }
          },
          {
            "@type": "Question",
            "name": "What hardware do I need to use AttendX?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "None beyond a projector or screen for the QR code and students' smartphones. There are no fingerprint scanners, RFID cards or biometric devices required."
            }
          },
          {
            "@type": "Question",
            "name": "Can teachers download attendance reports to Excel?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Faculty can generate a CSV/Excel sheet with roll numbers, names and per-date P/A/L/E status with totals and attendance percentage, filterable by date range."
            }
          }
        ]
      }
    </script>
