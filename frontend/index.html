        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },

          "Live rotating QR codes",

          "Late / manual marking",

    <!-- Structured data: FAQ (mirrors the visible FAQ section) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does the QR code attendance system work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A faculty member starts a live lecture and a QR code appears on screen, refreshing every 5 seconds so screenshots can't be reused. Students point their phone camera at the code; AttendX verifies the QR signature and the student's GPS location against the classroom geofence before marking them present."
            }
          },
          {
            "@type": "Question",
            "name": "Can a student mark attendance from outside the classroom (proxy attendance)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Every scan is geofence-verified against the classroom coordinates and the student's live GPS. If they are outside the allowed area, the mark is rejected. The rotating QR also makes sharing a screenshot useless. That is how AttendX stops proxy attendance."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need biometric, RFID or any special hardware?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. You only need a screen or projector to show the QR and students' smartphones. There are no fingerprint scanners, RFID cards or biometric devices required, which is why a QR + GPS attendance system costs a fraction of biometric attendance."
            }
          },
          {
            "@type": "Question",
            "name": "Is AttendX only for colleges, or also for schools and coaching institutes?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "AttendX works for any institution that teaches in rooms: colleges, universities, schools, coaching institutes and training centres. Departments, classes, subjects and batches are configured by the admin, so the same system fits a 200-student school and a multi-department college."
            }
          },
          {
            "@type": "Question",
            "name": "Do students need to install an app?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No app install. AttendX is a web app: students open the site in the phone browser, allow the camera and location once, and scan. It works on Android and iPhone."
            }
          },
          {
            "@type": "Question",
            "name": "What if a student arrives late?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Faculty can manually mark a late student as Present, Late or Excused from the live session or from the history view. Auto-finalization still marks everyone else correctly."
            }
          },
          {
            "@type": "Question",
            "name": "Can teachers export attendance to Excel?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Faculty generate a CSV/Excel sheet with roll numbers, names and a per-date P/A/L/E grid including totals and attendance percentage, filterable by date range. This is the attendance report most colleges need for the 75% rule."
            }
          },
          {
            "@type": "Question",
            "name": "Is it free to try?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "AttendX is free to start. The demo includes seeded admin, faculty and student accounts so you can test the whole flow in minutes."
            }
          }
        ]
      }
    </script>
